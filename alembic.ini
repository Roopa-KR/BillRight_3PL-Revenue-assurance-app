[alembic]
script_location = migrations
# The database URL comes from DATABASE_OWNER_URL (see migrations/env.py); migrations run as the owner role.

[loggers]
keys = root
[handlers]
keys = console
[formatters]
keys = generic
[logger_root]
level = WARN
handlers = console
[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic
[formatter_generic]
format = %(levelname)s %(name)s %(message)s
